<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMBRS — Molotow Order</title>
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#161619;
    --panel2:#1e1e22;
    --border:#2a2a2f;
    --text:#f2f2f2;
    --muted:#9a9aa2;
    --accent:#ff6a39;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Malgun Gothic",sans-serif;
    padding-bottom:80px;
  }
  header{
    padding:20px 16px 0;
  }
  .title{
    font-weight:800;
    font-size:20px;
    letter-spacing:0.5px;
    margin-bottom:14px;
  }
  .tabs{
    display:flex;
    gap:4px;
    border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  .tab{
    padding:10px 14px;
    font-size:13px;
    font-weight:700;
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  .tab.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }
  .search-wrap{
    padding:12px 16px;
  }
  .search-wrap input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
  }
  .section-label{
    padding:10px 16px 4px;
    font-size:12px;
    font-weight:800;
    color:var(--muted);
    letter-spacing:1px;
  }
  .color-list{
    padding:0 16px;
  }
  .color-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .color-swatch{
    width:36px;
    height:36px;
    border-radius:8px;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.08);
  }
  .color-info{
    flex:1;
    min-width:0;
  }
  .color-num{
    font-size:11px;
    color:var(--muted);
    font-weight:700;
  }
  .color-name{
    font-size:14px;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cap-spec{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .qty-ctrl{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .qty-btn{
    width:28px;
    height:28px;
    border-radius:6px;
    background:var(--panel2);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    font-size:16px;
  }
  .qty-btn:active{background:var(--border);}
  .qty-display{
    min-width:20px;
    text-align:center;
    font-weight:700;
    font-size:14px;
  }
  .qty-display.nonzero{color:var(--accent);}

  .order-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--panel);
    border-top:1px solid var(--border);
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    z-index:50;
  }
  .order-bar .count{
    font-weight:800;
    color:var(--accent);
  }

  .order-panel{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:flex-end;
    z-index:100;
  }
  .order-panel.open{display:flex;}
  .order-sheet{
    background:var(--panel);
    width:100%;
    max-height:80vh;
    border-radius:16px 16px 0 0;
    display:flex;
    flex-direction:column;
  }
  .order-sheet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px;
    border-bottom:1px solid var(--border);
  }
  .order-sheet-header .name{font-weight:800;font-size:16px;}
  .close-btn{
    cursor:pointer;
    font-size:18px;
    color:var(--muted);
    padding:4px 8px;
  }
  .order-sheet-body{
    overflow-y:auto;
    padding:8px 16px;
    flex:1;
  }
  .order-group-title{
    font-weight:800;
    font-size:13px;
    color:var(--accent);
    margin:14px 0 6px;
  }
  .order-line{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:4px 0;
    color:var(--text);
  }
  .order-line .oname{color:var(--muted);}
  .order-subtotal{
    font-size:12px;
    color:var(--muted);
    padding:4px 0 0;
    border-top:1px dashed var(--border);
    margin-top:4px;
  }
  .order-sheet-footer{
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
  }
  .btn-ghost{
    background:var(--panel2);
    color:var(--text);
  }
  .btn-primary{
    background:var(--accent);
    color:#1a0a02;
  }
  .empty-msg{
    color:var(--muted);
    font-size:13px;
    padding:24px 0;
    text-align:center;
  }
  .toast{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:#2c2c31;
    color:var(--text);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;
    z-index:200;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="title">BMBRS × MOLOTOW</div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="search-wrap">
  <input id="searchInput" type="search" placeholder="번호 또는 컬러명 검색...">
</div>

<div class="color-list" id="colorList"></div>

<div class="order-bar" id="orderBar">
  <span>ORDER LIST</span>
  <span class="count" id="orderCount">0개</span>
</div>

<div class="order-panel" id="orderPanel">
  <div class="order-sheet">
    <div class="order-sheet-header">
      <div class="name">ORDER LIST</div>
      <div class="close-btn" id="closeOrder">✕</div>
    </div>
    <div class="order-sheet-body" id="orderBody"></div>
    <div class="order-sheet-footer">
      <div class="btn btn-ghost" id="clearAllBtn">전체 초기화</div>
      <div class="btn btn-primary" id="copyOrderBtn">주문서 복사</div>
    </div>
  </div>
</div>

<div class="toast" id="toast">클립보드에 복사됐습니다</div>

const CATEGORY_LABELS = {
  premium: 'PREMIUM',
  coversall: 'COVERSALL',
  urbanfa: 'URBAN F/A',
  caps: 'CAPS'
};

const TAB_ORDER = ['premium','coversall','urbanfa','caps'];

let currentTab = 'premium';
let qty = {}; // qty[category][num] = count

function initQty(){
  TAB_ORDER.forEach(cat => { qty[cat] = {}; });
}
initQty();

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem('bmbrsOrderQty') || 'null');
    if(saved) qty = Object.assign(qty, saved);
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem('bmbrsOrderQty', JSON.stringify(qty)); }catch(e){}
}
loadState();

const tabsEl = document.getElementById('tabs');
TAB_ORDER.forEach(cat => {
  const el = document.createElement('div');
  el.className = 'tab' + (cat === currentTab ? ' active' : '');
  el.textContent = CATEGORY_LABELS[cat];
  el.dataset.cat = cat;
  el.addEventListener('click', () => {
    currentTab = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
    document.getElementById('searchInput').value = '';
    render();
  });
  tabsEl.appendChild(el);
});

function changeQty(cat, num, delta){
  const cur = qty[cat][num] || 0;
  const next = Math.max(0, cur + delta);
  qty[cat][num] = next;
  saveState();
  const disp = document.getElementById('qty_' + cat + '_' + num);
  if(disp){
    disp.textContent = next;
    disp.classList.toggle('nonzero', next > 0);
  }
  updateOrderBar();
}
window.changeQty = changeQty;

function render(){
  const listEl = document.getElementById('colorList');
  listEl.innerHTML = '';
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  if(currentTab === 'caps'){
    DATA.caps.forEach(row => {
      if(row.group){
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = row.group;
        listEl.appendChild(label);
        return;
      }
      if(q && !(row.num.toLowerCase().includes(q) || row.name.toLowerCase().includes(q))) return;
      listEl.appendChild(buildCapItem(row));
    });
    return;
  }

  const items = DATA[currentTab];
  items.forEach(item => {
    if(q && !(item.num.toLowerCase().includes(q) || item.name.toLowerCase().includes(q))) return;
    listEl.appendChild(buildColorItem(currentTab, item));
  });
}

function buildColorItem(cat, item){
  const wrap = document.createElement('div');
  wrap.className = 'color-item';
  wrap.dataset.num = item.num;
  wrap.dataset.name = item.name;

  const swatch = document.createElement('div');
  swatch.className = 'color-swatch';
  swatch.style.background = '#' + item.hex;
  wrap.appendChild(swatch);

  const info = document.createElement('div');
  info.className = 'color-info';
  const numEl = document.createElement('div');
  numEl.className = 'color-num';
  numEl.textContent = '#' + item.num;
  const nameEl = document.createElement('div');
  nameEl.className = 'color-name';
  nameEl.textContent = item.name;
  info.appendChild(numEl);
  info.appendChild(nameEl);
  wrap.appendChild(info);

  wrap.appendChild(buildQtyCtrl(cat, item.num));
  return wrap;
}

function buildCapItem(row){
  const wrap = document.createElement('div');
  wrap.className = 'color-item';
  wrap.dataset.num = row.num;
  wrap.dataset.name = row.name;

  const info = document.createElement('div');
  info.className = 'color-info';
  const numEl = document.createElement('div');
  numEl.className = 'color-num';
  numEl.textContent = row.num;
  const specEl = document.createElement('div');
  specEl.className = 'cap-spec';
  specEl.textContent = row.spec;
  const nameEl = document.createElement('div');
  nameEl.className = 'color-name';
  nameEl.textContent = row.name;
  info.appendChild(numEl);
  info.appendChild(specEl);
  info.appendChild(nameEl);
  wrap.appendChild(info);

  wrap.appendChild(buildQtyCtrl('caps', row.num));
  return wrap;
}

function buildQtyCtrl(cat, num){
  const ctrl = document.createElement('div');
  ctrl.className = 'qty-ctrl';

  const minus = document.createElement('div');
  minus.className = 'qty-btn';
  minus.textContent = '−';
  minus.addEventListener('click', () => changeQty(cat, num, -1));

  const disp = document.createElement('div');
  const cur = qty[cat][num] || 0;
  disp.className = 'qty-display' + (cur > 0 ? ' nonzero' : '');
  disp.id = 'qty_' + cat + '_' + num;
  disp.textContent = cur;

  const plus = document.createElement('div');
  plus.className = 'qty-btn';
  plus.textContent = '+';
  plus.addEventListener('click', () => changeQty(cat, num, 1));

  ctrl.appendChild(minus);
  ctrl.appendChild(disp);
  ctrl.appendChild(plus);
  return ctrl;
}

document.getElementById('searchInput').addEventListener('input', render);

function findItemName(cat, num){
  if(cat === 'caps'){
    const row = DATA.caps.find(r => r.num === num);
    return row ? row.name : num;
  }
  const item = DATA[cat].find(it => it.num === num);
  return item ? item.name : num;
}

function getOrderData(){
  const groups = [];
  let totalCount = 0;
  TAB_ORDER.forEach(cat => {
    const entries = Object.entries(qty[cat] || {}).filter(([,c]) => c > 0);
    if(entries.length === 0) return;
    entries.sort((a,b) => a[0].localeCompare(b[0], undefined, {numeric:true}));
    let subtotal = 0;
    const lines = entries.map(([num, count]) => {
      subtotal += count;
      return { num, name: findItemName(cat, num), count };
    });
    totalCount += subtotal;
    groups.push({ cat, label: CATEGORY_LABELS[cat], lines, subtotal });
  });
  return { groups, totalCount };
}

function updateOrderBar(){
  const { totalCount } = getOrderData();
  document.getElementById('orderCount').textContent = totalCount + '개';
}

function renderOrderPanel(){
  const body = document.getElementById('orderBody');
  body.innerHTML = '';
  const { groups, totalCount } = getOrderData();

  if(groups.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = '담긴 항목이 없습니다';
    body.appendChild(empty);
    return;
  }

  groups.forEach(g => {
    const title = document.createElement('div');
    title.className = 'order-group-title';
    title.textContent = '[' + g.label + ']';
    body.appendChild(title);

    g.lines.forEach(line => {
      const row = document.createElement('div');
      row.className = 'order-line';
      const left = document.createElement('span');
      left.className = 'oname';
      left.textContent = '#' + line.num + ' ' + line.name;
      const right = document.createElement('span');
      right.textContent = '× ' + line.count;
      row.appendChild(left);
      row.appendChild(right);
      body.appendChild(row);
    });

    const sub = document.createElement('div');
    sub.className = 'order-subtotal';
    sub.textContent = '소계: ' + g.subtotal + '개';
    body.appendChild(sub);
  });

  const totalRow = document.createElement('div');
  totalRow.className = 'order-subtotal';
  totalRow.style.marginTop = '16px';
  totalRow.style.fontWeight = '800';
  totalRow.textContent = '합계: ' + totalCount + '개';
  body.appendChild(totalRow);
}

function buildOrderText(){
  const { groups, totalCount } = getOrderData();
  const DIV = '────────────';
  let lines = [];
  lines.push('BMBRS Molotow 주문');
  lines.push(DIV);
  lines.push('');
  groups.forEach(g => {
    lines.push('[' + g.label + ']');
    g.lines.forEach(line => {
      lines.push('#' + line.num + ' ' + line.name + ' × ' + line.count);
    });
    lines.push('소계: ' + g.subtotal + '개 ');
    lines.push('');
  });
  lines.push(DIV);
  lines.push('합계: ' + totalCount + '개 ');
  return lines.join('\n');
}

document.getElementById('orderBar').addEventListener('click', () => {
  renderOrderPanel();
  document.getElementById('orderPanel').classList.add('open');
});
document.getElementById('closeOrder').addEventListener('click', () => {
  document.getElementById('orderPanel').classList.remove('open');
});
document.getElementById('orderPanel').addEventListener('click', (e) => {
  if(e.target.id === 'orderPanel') document.getElementById('orderPanel').classList.remove('open');
});

document.getElementById('clearAllBtn').addEventListener('click', () => {
  TAB_ORDER.forEach(cat => { qty[cat] = {}; });
  saveState();
  render();
  renderOrderPanel();
  updateOrderBar();
});

document.getElementById('copyOrderBtn').addEventListener('click', async () => {
  const text = buildOrderText();
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
});

render();
updateOrderBar();
</script>
</body>
</html>
